<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game 1</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #888888; /* grey background */
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      color: #222;
      position: relative;
    }
    .home-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: #0078d7;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
      transition: background-color 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .home-btn:hover {
      background-color: #005ea2;
    }
    .container {
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      max-width: 480px;
      width: 100%;
      padding: 25px;
      margin: 80px auto 0; /* pushed down so home button doesn't overlap */
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: 2.2rem;
      margin-bottom: 15px;
    }
    .game-image {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .description {
      font-size: 1.1rem;
      line-height: 1.5;
      margin-bottom: 30px;
      color: #555;
    }
    .launch-btn {
      background-color: #0078d7;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 15px 40px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .launch-btn:hover {
      background-color: #005ea2;
    }
  </style>
</head>
<body>
  <a href="index.html" class="home-btn" title="Back to Home">Home</a>

  <div class="container">
    <h1>Game 1</h1>
    <img
      src="https://via.placeholder.com/480x250.png?text=Game+1+Image"
      alt="Game 1 Screenshot"
      class="game-image"
    />
    <p class="description">
      Dive into the exciting world of Game 1! Explore new adventures, conquer challenges, and enjoy hours of fun.
    </p>
    <button class="launch-btn" onclick="launchGame()">Launch Game</button>
  </div>

  <script>
    function launchGame() {
      window.location.href = "game1://launch";
    }
  </script>
</body>
</html>
