<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game 1</title>
  <style>
    /* Reset some default margin/padding */
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #222;
    }
    .container {
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      max-width: 480px;
      width: 100%;
      padding: 25px;
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: 2.2rem;
      margin-bottom: 15px;
    }
    .game-image {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .description {
      font-size: 1.1rem;
      line-height: 1.5;
      margin-bottom: 30px;
      color: #555;
    }
    .launch-btn {
      background-color: #0078d7;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 15px 40px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .launch-btn:hover {
      background-color: #005ea2;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Game 1</h1>
    <img
      src="https://via.placeholder.com/480x250.png?text=Game+1+Image"
      alt="Game 1 Screenshot"
      class="game-image"
    />
    <p class="description">
      Dive into the exciting world of Game 1! Explore new adventures, conquer challenges, and enjoy hours of fun.
    </p>
    <button class="launch-btn" onclick="launchGame()">Launch Game</button>
  </div>

  <script>
    function launchGame() {
      window.location.href = "game1://launch";
      setTimeout(() => {
        alert("If the game didn't open, please make sure it is installed and registered with 'game1://' protocol.");
      }, 1000);
    }
  </script>
</body>
</html>
